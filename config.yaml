# Sand Loop bot configuration. All game coordinates are relative (0..1) to the iPhone screen area.

window:
  # CGWindowList owner name of the mirroring app. It may be localized — run `python -m capture list`.
  owner_name: "iPhone Mirroring"
  # Optional substring the window title must contain (null = any title).
  title_contains: null
  # Used to activate the app via osascript before tapping.
  app_bundle_id: "com.apple.ScreenContinuity"
  # How often (seconds) to re-resolve the window bounds, in case it was moved.
  refresh_interval_s: 2.0

screen:
  # "window" = capture the mirroring window alone via Quartz (Retina, ignores windows on top).
  # "mss"    = screen-region capture (fallback; nominal resolution, sees overlapping windows).
  capture: window
  # "auto" = detect the iPhone screen area inside the window,
  # or [x, y, w, h] relative to the window bounds (0..1) as a manual override.
  content: auto
  # With capture=window the screen is the opaque area of the window. The settings below are for
  # the mss fallback (trim uniform borders). Auto-detection never trims more than this fraction of the window from any side.
  auto_max_trim: 0.15
  # Max per-row/column grey-level std (0..255) for a border strip to count as uniform chrome.
  uniform_tolerance: 6.0
  # Sanity check: the detected screen must have the iPhone's width / height (relative tolerance).
  # A window partly off-screen or being dragged gives a cut-off screen: those frames are rejected.
  aspect: 0.4624             # 602 x 1302 px
  aspect_tolerance: 0.02

clicks:
  backend: quartz            # quartz | pyautogui
  press_duration_s: 0.05     # pause between mouseDown and mouseUp
  move_settle_s: 0.03        # pause after moving the cursor, before pressing
  max_taps_per_second: 4.0
  activate_before_tap: true  # bring the mirroring window to front if it lost focus

safety:
  failsafe_corner_pt: 5      # cursor within this many points of any display corner = stop
  hotkey_pause: "ctrl+alt+p"
  hotkey_quit: "ctrl+alt+q"

stability:
  threshold: 0.01            # mean abs frame diff (0..1) below which the frame counts as stable
  timeout_s: 3.0
  interval_s: 0.1

overlay:
  max_height: 900            # overlay window height in pixels
  hotkey_save: "ctrl+alt+s"  # global (works from any app): save frame + dry-run decision to debug/

collect:                     # python -m tools.collect (dataset screenshots)
  hotkey_snap: "ctrl+alt+s"  # save the current frame now
  change_threshold: 0.03     # auto mode: min difference (0..1) from the last saved shot
  min_interval_s: 1.0        # auto mode: min seconds between saved shots
  poll_s: 0.2                # how often to grab a frame

vision:                      # vision.py / screens.py; colours come from dataset/palette.json
  # zones, relative [x0, y0, x1, y1] of the iPhone screen
  picture: [0.18, 0.125, 0.82, 0.425]
  conveyor: [0.06, 0.448, 0.94, 0.49]
  fill_text: [0.0, 0.485, 1.0, 0.512]
  counter: [0.42, 0.505, 0.58, 0.548]
  grid_zone: [0.0, 0.52, 1.0, 0.88]
  cell_aspect: 0.885         # cell height / width (fixed camera perspective)
  cell_shift_up: 0.1         # objects are drawn overhanging into the row above
  cell_inset: 0.125          # crop inset per side, share of the cell size
  panel_tol: 12.0            # LAB distance to the panel background colour
  # live crops can be a few px off (pt/px rounding, window edge, hover-chrome frame):
  edge_margin: 0.03          # share of width ignored at the left/right frame edge (grid finder)
  counter_search: 0.02       # share of height the "k/5" search extends the counter zone up/down
  disc_min_dist: 20.0        # face-down tower = centre disc this far (LAB) from the ring around it (open bucket: <= 5, disc: >= 76)
  unknown_sand_min: 0.03     # unknown sand colour = a compact cluster of unmatched pixels >= this share of the picture
  icon_threshold: 0.75       # lock / key icon match (grey shape; L183: icons >= 0.82, other cells <= 0.62)
  empty_tol: 10.0            # LAB distance to the empty-cell colour
  empty_min_frac: 0.5        # share of empty-colour pixels for an empty cell
  face_up_max_ratio: 0.88    # centre V / top-stage rim V below this = face-up (up <= 0.83, down >= 0.93)
  colour_watch: [[green, darkgreen]]  # close colour pairs: every such bucket is printed with its distance to both (debug)
  rim_percentile: 75         # open bucket colour = top-stage pixels at least this V percentile (the rim; inside is shaded). 85+ pulls darkgreen rims toward green
  face_ref_percentile: 85    # rim brightness = this percentile of V in the top part of the object
  tower_min_margin: 8.0      # LAB margin for a real second colour (tower stage)
  ice_min_white: 0.10
  ice_min_dark: 0.05
  color_max_dist: 22.0       # LAB distance to the nearest palette bucket colour
  sand_max_dist: 18.0
  slot_min_cover: 0.55       # conveyor: object share of a bucket's run (end posts ~0.45)
  bottom_band: 0.06          # fallback "exposed" band (share of the picture) if no bottom edge found
  # hint arrows over the grid bottom (hints.py, dataset/templates/hints/): masked out of the
  # lattice, inpainted before cells are read; a cell more covered than hint_cover_max (or read
  # UNKNOWN through the mask) is occluded: last clean reading reused, never tapped, never saved
  # as unknown
  hint_threshold: 0.8
  hint_scales: [0.9, 1.0, 1.1]
  hint_downscale: 0.5        # match on the grid zone scaled by this (speed)
  hint_cover_max: 0.5        # 055: cells 39-42 % hidden still read right through the inpainted mask
  lower_band: 0.3            # "lower part" of the picture zone: sand there reaches the belt soon (strategy: unlock value)
  # "exposed" = the contact layer: the lowest rows of sand right above the picture's bottom edge
  contact_search: 0.02       # share of screen height searched around picture[3] for that edge
  contact_layer: 0.008       # layer thickness, share of screen height (~10 px at 1302) sand
  canonical_width: 301       # frames are resized to this width for template matching
  template_threshold: 0.75
  template_thresholds: {close_red: 0.95, ad_mute: 0.85}
  template_scales: [0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.15, 1.3]

strategy:                    # state.py / strategy.py (greedy), see docs/GAME_RULES.md
  conveyor_slots: 5          # "k/5" on the HUD
  min_exposed: 0.03          # release a colour only if avail (see below) is at least this
  last_slot_min_exposed: 0.25  # stricter threshold when the tap would take the last free slot
  # remaining sand of the colour >= margin * (its conveyor need + 1) * estimated bucket capacity,
  # capacity = remaining sand / pending buckets (levels are balanced, GAME_RULES.md)
  sufficiency_margin: 0.5
  unknown_fill_need: 0.5     # conveyor bucket with no fill label: assumed share still to fill
  weight_exposed: 1.0        # score per exposed share of the colour
  weight_open_bucket: 0.05   # score per bucket the tap connects to the exit, any colour (the colour's worth: weight_unlock_value)
  weight_open_lock: 0.05     # score per lock cell (ice, curtain) the tap connects to the exit
  weight_key_unlock: 0.15    # score per bucket under a lock that the tap opens (its key gets connected and flies)
  # a tower takes one belt slot until all its stages are full: penalty per later stage whose
  # colour has not enough sand left (same sufficiency test as the top colour)
  weight_tower_short_stage: 0.5
  weight_new_colour: 0.05    # bonus for a colour that is not on the belt yet (also the tie-break)
  # demand-aware exposure: avail = contact-layer share of the colour - this x (1 - fill) for
  # every same-colour bucket already on the belt
  belt_demand_exposure: 0.25
  stall_s: 4.0               # a belt colour whose fill hasn't grown this long = sand not reachable
  analyze_interval_s: 0.5    # overlay --dry-run: min seconds between analyses
  confirm_frames: 2          # tap only after this many consecutive analyses chose the same move
  vision_fail_max_saves: 300 # failed reads (frame + step) saved to debug/vision_fail/ per run

paths:
  dataset: dataset
  debug: debug
  palette: dataset/palette.json
