# Sand Loop bot configuration. All game coordinates are relative (0..1) to the iPhone screen area.

window:
  # CGWindowList owner name of the mirroring app. It may be localized — run `python -m capture list`.
  owner_name: "iPhone Mirroring"
  # Optional substring the window title must contain (null = any title).
  title_contains: null
  # Used to activate the app via osascript before tapping.
  app_bundle_id: "com.apple.ScreenContinuity"
  # How often (seconds) to re-resolve the window bounds, in case it was moved.
  refresh_interval_s: 2.0

screen:
  # "window" = capture the mirroring window alone via Quartz (Retina, ignores windows on top).
  # "mss"    = screen-region capture (fallback; nominal resolution, sees overlapping windows).
  capture: window
  # "auto" = detect the iPhone screen area inside the window,
  # or [x, y, w, h] relative to the window bounds (0..1) as a manual override.
  content: auto
  # With capture=window the screen is the opaque area of the window. The settings below are for
  # the mss fallback (trim uniform borders). Auto-detection never trims more than this fraction of the window from any side.
  auto_max_trim: 0.15
  # Max per-row/column grey-level std (0..255) for a border strip to count as uniform chrome.
  uniform_tolerance: 6.0

clicks:
  backend: quartz            # quartz | pyautogui
  press_duration_s: 0.05     # pause between mouseDown and mouseUp
  move_settle_s: 0.03        # pause after moving the cursor, before pressing
  max_taps_per_second: 4.0
  activate_before_tap: true  # bring the mirroring window to front if it lost focus

safety:
  failsafe_corner_pt: 5      # cursor within this many points of any display corner = stop
  hotkey_pause: "ctrl+alt+p"
  hotkey_quit: "ctrl+alt+q"

stability:
  threshold: 0.01            # mean abs frame diff (0..1) below which the frame counts as stable
  timeout_s: 3.0
  interval_s: 0.1

overlay:
  max_height: 900            # overlay window height in pixels

collect:                     # python -m tools.collect (dataset screenshots)
  hotkey_snap: "ctrl+alt+s"  # save the current frame now
  change_threshold: 0.03     # auto mode: min difference (0..1) from the last saved shot
  min_interval_s: 1.0        # auto mode: min seconds between saved shots
  poll_s: 0.2                # how often to grab a frame

vision:                      # vision.py / screens.py; colours come from dataset/palette.json
  # zones, relative [x0, y0, x1, y1] of the iPhone screen
  picture: [0.18, 0.125, 0.82, 0.425]
  conveyor: [0.06, 0.448, 0.94, 0.49]
  fill_text: [0.0, 0.485, 1.0, 0.512]
  counter: [0.42, 0.505, 0.58, 0.548]
  grid_zone: [0.0, 0.52, 1.0, 0.88]
  cell_aspect: 0.885         # cell height / width (fixed camera perspective)
  cell_shift_up: 0.1         # objects are drawn overhanging into the row above
  cell_inset: 0.125          # crop inset per side, share of the cell size
  panel_tol: 12.0            # LAB distance to the panel background colour
  empty_tol: 10.0            # LAB distance to the empty-cell colour
  empty_min_frac: 0.5        # share of empty-colour pixels for an empty cell
  face_up_max_ratio: 0.94    # centre V / top-part median V below this = face-up
  tower_min_margin: 8.0      # LAB margin for a real second colour (tower stage)
  ice_min_white: 0.10
  ice_min_dark: 0.05
  color_max_dist: 22.0       # LAB distance to the nearest palette bucket colour
  sand_max_dist: 18.0
  slot_min_cover: 0.55       # conveyor: object share of a bucket's run (end posts ~0.45)
  bottom_band: 0.06          # bottom share of the picture counted as "exposed" sand
  canonical_width: 301       # frames are resized to this width for template matching
  template_threshold: 0.75
  template_thresholds: {close_red: 0.95, ad_mute: 0.85}
  template_scales: [0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.15, 1.3]

paths:
  dataset: dataset
  debug: debug
  palette: dataset/palette.json
