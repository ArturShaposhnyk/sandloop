# Sand Loop bot configuration. All game coordinates are relative (0..1) to the iPhone screen area.

window:
  # CGWindowList owner name of the mirroring app. It may be localized — run `python -m capture list`.
  owner_name: "iPhone Mirroring"
  # Optional substring the window title must contain (null = any title).
  title_contains: null
  # Used to activate the app via osascript before tapping.
  app_bundle_id: "com.apple.ScreenContinuity"
  # How often (seconds) to re-resolve the window bounds, in case it was moved.
  refresh_interval_s: 2.0

screen:
  # "window" = capture the mirroring window alone via Quartz (Retina, ignores windows on top).
  # "mss"    = screen-region capture (fallback; nominal resolution, sees overlapping windows).
  capture: window
  # "auto" = detect the iPhone screen area inside the window,
  # or [x, y, w, h] relative to the window bounds (0..1) as a manual override.
  content: auto
  # With capture=window the screen is the opaque area of the window. The settings below are for
  # the mss fallback (trim uniform borders). Auto-detection never trims more than this fraction of the window from any side.
  auto_max_trim: 0.15
  # Max per-row/column grey-level std (0..255) for a border strip to count as uniform chrome.
  uniform_tolerance: 6.0
  # Sanity check: the detected screen must have the iPhone's width / height (relative tolerance).
  # A window partly off-screen or being dragged gives a cut-off screen: those frames are rejected.
  aspect: 0.4624             # 602 x 1302 px
  aspect_tolerance: 0.02

clicks:
  backend: quartz            # quartz | pyautogui
  press_duration_s: 0.05     # pause between mouseDown and mouseUp
  move_settle_s: 0.03        # pause after moving the cursor, before pressing
  max_taps_per_second: 4.0
  activate_before_tap: true  # bring the mirroring window to front if it lost focus
  # live runs activate the window once before the first tap too (run 161536: TAP #1 right
  # after activation "had no visible effect"): wait until it is frontmost, then settle
  focus_wait_s: 2.0
  focus_settle_s: 0.5

safety:
  failsafe_corner_pt: 5      # cursor within this many points of any display corner = stop
  hotkey_pause: "ctrl+alt+p"
  hotkey_quit: "ctrl+alt+q"

stability:
  threshold: 0.01            # mean abs frame diff (0..1) below which the frame counts as stable
  timeout_s: 3.0
  interval_s: 0.1

overlay:
  max_height: 900            # overlay window height in pixels
  hotkey_save: "ctrl+alt+s"  # global (works from any app): save frame + dry-run decision to debug/

collect:                     # python -m tools.collect (dataset screenshots)
  hotkey_snap: "ctrl+alt+s"  # save the current frame now
  change_threshold: 0.03     # auto mode: min difference (0..1) from the last saved shot
  min_interval_s: 1.0        # auto mode: min seconds between saved shots
  poll_s: 0.2                # how often to grab a frame

vision:                      # vision.py / screens.py; colours come from dataset/palette.json
  # zones, relative [x0, y0, x1, y1] of the iPhone screen
  picture: [0.18, 0.125, 0.82, 0.425]
  conveyor: [0.06, 0.448, 0.94, 0.49]
  fill_text: [0.0, 0.485, 1.0, 0.512]
  counter: [0.42, 0.505, 0.58, 0.548]
  grid_zone: [0.0, 0.52, 1.0, 0.88]
  cell_aspect: 0.885         # cell height / width (fixed camera perspective)
  pitch_harmonic_ratio: 0.8  # column pitch: a peak at 1/2 or 1/3 of the strongest one, at least this strong, wins (L187 walls every 2 columns: 2x pitch 0.511 vs real 0.502)
  pitch_wall_align: 0.8      # the walls inside the grid (lanes, notches) must sit on cell boundaries for this share, else 1/2 or 1/3 of the pitch is tried (L187 run 20261020-122638: 4x4 mid-level)
  cell_shift_up: 0.1         # objects are drawn overhanging into the row above
  unlock_trust_s: 10.0       # a key lock just opened: its cells follow the path rule alone this long (padlock animation hides the face)
  # user rule (2026-10-20): a just-unlocked bucket is tapped at once only with a confident colour
  # (not the lock's own colour, nearest colour <= unlock_confident_dist and the runner-up >=
  # unlock_confident_margin further); otherwise wait until the padlock is gone (unlock_wait_s)
  unlock_wait_s: 2.0
  unlock_confident_dist: 12.0
  unlock_confident_margin: 8.0
  cell_inset: 0.125          # crop inset per side, share of the cell size
  panel_tol: 12.0            # LAB distance to the panel background colour
  # live crops can be a few px off (pt/px rounding, window edge, hover-chrome frame):
  edge_margin: 0.03          # share of width ignored at the left/right frame edge (grid finder)
  counter_search: 0.02       # share of height the "k/5" search extends the counter zone up/down
  disc_min_dist: 20.0        # face-down tower = centre disc this far (LAB) from the ring around it (open bucket: <= 5, disc: >= 76)
  unknown_sand_min: 0.03     # unknown sand colour = a compact cluster of unmatched pixels >= this share of the picture
  # picture.py (L188): shells in the picture / picture locks (keyhole + its box's dark frame)
  pic_shell_threshold: 0.76  # L188 066-069: shells 0.76-0.98, sand / stars <= 0.75, other levels <= 0.73
  pic_shell_purity: 0.85     # share of the shell's pixels in its one bucket colour
  keyhole_threshold: 0.8     # keyholes 0.96-1.0, anything else <= 0.42
  pic_lock_frame_v: 110
  pic_lock_max: 0.4
  shell_threshold: 0.84      # (L189 plain cyan dome 0.81; live L188 shells 0.86-0.99) L188 shell icon on a bucket (icons.ShellMatcher: shells >= 0.82 with their own template left out, plain buckets <= 0.78, tower tops up to 0.83 - told apart by colour)
  shell_grey_chroma: 12.0    # L188 shell bucket: its shell's chroma below this = grey shell inside = face-up
  icon_threshold: 0.75       # lock / key icon match (grey shape on icon_inset crops; L187 icons >= 0.88 with their own template left out, other cells <= 0.65)
  icon_inset: 0.05           # icons are matched on the cell's own rect (not shifted up like buckets) minus this per side
  # L186 chest (wooden box with a number) and mystery bucket (grey with "?"): colour shares
  # against palette ui chest_wood / mystery_grey (chests 0.33-0.35 vs <= 0.06; mystery ~0.5)
  chest_tol: 12.0
  chest_min_wood: 0.2
  mystery_tol: 10.0
  mystery_min_grey: 0.3
  lattice_lock_frames: 3     # the grid geometry is fixed in a level (hints.LatticeLock): the first fitting reading is locked; for this many frames a finer reading of the same grid may still replace it, then it holds until a non-gameplay screen
  lattice_min_fit: 0.8       # a reading whose inner walls sit on its cell boundaries less than this is a misread outline (224 live / dataset frames: good >= 0.88, hint arrows / sparkles joined to the grid <= 0.54)
  flight_s: 2.0              # live: a cell read empty this recently stays empty - a tapped bucket flying up its lane read as buckets in empty cells (run 20261020-142035, ~1.4 s after the tap; hints.InFlight)
  empty_tol: 10.0            # LAB distance to the empty-cell colour
  empty_min_frac: 0.5        # share of empty-colour pixels for an empty cell
  face_up_max_ratio: 0.88    # centre V / top-stage rim V below this = face-up (up <= 0.83, down >= 0.93)
  colour_watch: [[green, darkgreen]]  # close colour pairs: every such bucket is printed with its distance to both (debug)
  rim_percentile: 75         # open bucket colour = top-stage pixels at least this V percentile (the rim; inside is shaded). 85+ pulls darkgreen rims toward green
  face_ref_percentile: 85    # rim brightness = this percentile of V in the top part of the object
  tower_min_margin: 8.0      # LAB margin for a real second colour (tower stage)
  split_bg_max: 0.15         # background row through a cell's middle with objects above and below = two objects (UNKNOWN, never a tower). Annotated buckets <= 0.042, fading padlocks <= 0.066; the run's merged 4x4 cells: 10 of 16 >= 0.17 (two touching buckets in a lane score ~0.1: the lattice checks are the main guard)
  foot_min_obj: 0.5          # open bucket: the strip under its crop (vision.foot_strip) is a lower tower stage if object pixels fill this share and its colour is another bucket colour (L187 r1c0 orange on cream)
  ice_min_white: 0.10
  ice_min_dark: 0.03         # run 20261021-092045: a thin "1" has 0.040 dark pixels (5: 0.058); ice also needs its number
  color_max_dist: 22.0       # LAB distance to the nearest palette bucket colour
  sand_max_dist: 18.0
  sand_min_share: 0.0005     # sand colours below this share of the picture are dropped (was 0.2 %: the
                             # last grains a 96-99 % bucket needs read as 0 - run 171133)
  slot_min_cover: 0.55       # conveyor: object share of a bucket's run (end posts ~0.45)
  bottom_band: 0.06          # fallback "exposed" band (share of the picture) if no bottom edge found
  # hint arrows over the grid bottom (hints.py, dataset/templates/hints/): masked out of the
  # lattice, inpainted before cells are read; a cell more covered than hint_cover_max (or read
  # UNKNOWN through the mask) is occluded: last clean reading reused, never tapped, never saved
  # as unknown
  hint_threshold: 0.8
  hint_row_threshold: 0.65   # run 20261021-092045 (L189): the 4 booster arrows over buckets / keys / the chain lock
                             # matched 0.60-0.79 (one frame none >= 0.8); 2+ arrows at one height and scale = a row
  hint_scales: [0.9, 1.0, 1.1]
  hint_downscale: 0.5        # match on the grid zone scaled by this (speed)
  hint_cover_max: 0.5        # 055: cells 39-42 % hidden still read right through the inpainted mask
  lower_band: 0.3            # "lower part" of the picture zone: sand there reaches the belt soon (strategy: unlock value)
  # "exposed" = the contact layer: the lowest rows of sand right above the picture's bottom edge
  contact_search: 0.02       # share of screen height searched around picture[3] for that edge
  # a bucket takes the bottom grains plus a few above (GAME_RULES): per picture column the lowest
  # contact_layer of SAND (empty picture skipped), share of screen height (~28 px at 1302; was a
  # 10 px band: L183 056 read cyan 2.6 % although the sky sat right above it -> 15 %)
  contact_layer: 0.022
  contact_reach: 0.07        # how far above the bottom edge that sand is looked for
  canonical_width: 301       # frames are resized to this width for template matching
  # popup over gameplay (run 20261021-101655 00507: the revive popup's "Keep Playing" sliding in
  # matched 0.49, the frame read "gameplay" and the board under it "green"): a bright green bar
  # >= 0.65 of the screen width over >= 1.5 % of its height (revive 0.72-0.76 / 2.3 %;
  # gameplay shots <= 0.58, no such rows) = screen "popup", the board is not analysed
  popup_bar_hue: [35, 85]
  popup_bar_min_sv: [120, 150]
  popup_bar_min_run: 0.65
  popup_bar_min_rows: 0.015
  template_threshold: 0.75
  # gameplay reaches 0.67 on level_completed, menus 0.60 on next, win screens 0.63 on status_icons
  template_thresholds: {close_red: 0.95, ad_mute: 0.85, level_completed: 0.85, next: 0.85,
                        status_icons: 0.85}
  template_scales: [0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.15, 1.3]

strategy:                    # state.py / strategy.py (greedy), see docs/GAME_RULES.md
  conveyor_slots: 5          # "k/5" on the HUD
  min_exposed: 0.03          # release a colour only if avail (see below) is at least this
  last_slot_min_exposed: 0.25  # stricter threshold when the tap would take the last free slot
  # remaining sand of the colour >= margin * (its conveyor need + 1) * estimated bucket capacity,
  # capacity = remaining sand / pending buckets (levels are balanced, GAME_RULES.md)
  sufficiency_margin: 0.5
  unknown_fill_need: 0.5     # conveyor bucket with no fill label: assumed share still to fill
  weight_exposed: 1.0        # score per exposed share of the colour
  weight_open_bucket: 0.05   # score per bucket the tap connects to the exit, any colour (the colour's worth: weight_unlock_value)
  weight_open_lock: 0.05     # score per lock cell (ice, curtain) the tap connects to the exit
  weight_key_unlock: 0.15    # score per bucket under a lock that the tap opens (its key gets connected and flies)
  # a tower takes one belt slot until all its stages are full: penalty per later stage whose
  # colour has not enough sand left (same sufficiency test as the top colour)
  weight_tower_short_stage: 0.5
  weight_new_colour: 0.05    # bonus for a colour that is not on the belt yet (also the tie-break)
  # demand-aware exposure: avail = contact-layer share of the colour - this x (1 - fill) for
  # every same-colour bucket already on the belt
  belt_demand_exposure: 0.25
  # waiting must have a reason: sand only moves while belt buckets collect (GAME_RULES "When to
  # wait"). min avail: last slot last_slot_min_exposed (min_exposed if the belt is idle);
  # >= relaxed_free_slots free or an idle belt: relaxed_min_exposed; a tap that opens a useful
  # bucket or is a planned path step with >= opener_free_slots free: opener_min_exposed;
  # otherwise min_exposed
  relaxed_free_slots: 3
  relaxed_min_exposed: 0.0   # 0 = no exposure needed (avail must not be negative), only enough sand left
  opener_free_slots: 2
  opener_min_exposed: 0.0
  stall_s: 4.0               # a belt colour whose fill hasn't grown this long = sand not reachable
  stall_min_growth: 2        # fill points that count as growth (the % labels jitter by 1)
  stall_forget_s: 3.0        # a belt colour not seen this long is forgotten (shorter gaps keep its clock)
  # one more bucket of a stalled colour = a lost slot: never while the belt still collects,
  # else this penalty (a last resort); a path step of that colour costs path_cost_stalled extra
  weight_stalled_colour: 2.0
  path_cost_stalled: 3.0
  # L186 chest: opening it (its cell connects to the exit) scatters N buckets into free cells
  # at random. Penalty = weight_chest_cut x expected free cells on paths it fills (blocking one
  # disconnects something) + weight_chest_free x share of free cells (few free cells: prefer
  # it). A penalty, not a rule: with nothing better it still goes.
  weight_chest_cut: 0.3
  weight_chest_free: 0.3
  # L186 mystery bucket: tapping a 4-neighbour reveals its colour (information)
  weight_mystery_reveal: 0.05
  weight_mystery_reachable: 0.15   # extra when the revealed bucket is then connected to the exit
  # last-slot gamble (user, 2026-10-20): every unfinished belt bucket gained no sand for this
  # long, one slot left, every move rejected only by the last-slot minimum -> take the slot
  # with the move that uncovers the most sand for the belt (sand.contact_layers), ties by its
  # own exposure. Logged "last-slot gamble". User (run 224631): only a bucket that can fill
  # (sand left >= gamble_fill_margin x (belt need + 1 bucket)) or opens the path to one; those
  # that fill themselves rank first.
  gamble_stuck_s: 5.0
  # L188 shells (user): a shell bucket takes a slot but collects nothing until a shell of its
  # colour reaches the picture's bottom - tap it only when one is this near the bottom edge
  # (share of the screen height, ~40 px; picture.PicShell.depth)
  shell_near_bottom: 0.03
  weight_pic_unlock: 0.3     # L188: a tap whose key flies to a picture lock (its sand starts falling)
  gamble_fill_margin: 1.0
  # phase 7 lookahead (lookahead.py): best continuation of up to look_depth taps (look_width
  # best-exposed follow-ups per step); value = (free slots + live belt buckets) / slots after it.
  # Live = sand >= look_sand_margin x need x capacity and (exposed >= look_min_exposed and not
  # stalled, or the settle step uncovers >= look_min_gain of it). Score += weight_lookahead x
  # (value after - value now); a tap that leaves the belt full with nothing live is rejected.
  look_depth: 3
  look_width: 3
  look_min_exposed: 0.03
  look_min_gain: 0.02
  look_sand_margin: 1.0
  weight_lookahead: 1.0
  # endgame (user, 2026-10-20, run 20261020-145310): with <= endgame_colours colours left on the
  # board, a bucket of a colour that is almost done (on the belt, or < 1 bucket of sand left) is
  # not tapped if it would leave fewer free slots than the other board colours that still have
  # >= endgame_sand_min buckets of sand in the picture and none on the belt (darkred there)
  endgame_colours: 3
  key_min_exposed: 0.2       # key colours (endgame.key_reserve): a board colour this much of the contact
                             # layer (or covering buried belt colours) keeps the slots needed to reach its
                             # nearest bucket (1 + buckets in front on the path; user, run 171133)
  endgame_sand_min: 0.5
  # ice (user, L189 run 20261021-092045): ice N = N more taps before the bucket under it can be
  # tapped, and every tap takes a belt slot. With the ice reachable (b buckets in front on its
  # path), keep max(N, b) + 1 slots free: a tap that would leave fewer is allowed only for a
  # bucket that fills and leaves (exposed >= ice_live_exposed, enough sand, not stalled) - only
  # while that many slots exist (ice 15 at the start reserves nothing)
  ice_live_exposed: 0.08     # = planner.fill_min_exposed: below it a belt bucket gets ~nothing
  # lost position (user, same run): belt stuck this long, no move passes the rules and the
  # last-slot gamble finds none -> tap the best remaining bucket to end the level quickly (the
  # loss is recorded in levels.jsonl, the level memory bans the sequence, then Try Again)
  lost_stuck_s: 15.0
  chest_settle_s: 1.5        # a chest opened: no decision this long (its buckets are landing), then a full re-read
  analyze_interval_s: 0.5    # overlay --dry-run: min seconds between analyses
  confirm_frames: 2          # tap only after this many consecutive analyses chose the same move
  vision_fail_max_saves: 300 # failed reads (frame + step) saved to debug/vision_fail/ per run

bot:                         # python -m bot: plays one level (docs/GAME_RULES.md, PROMPT.md phase 5)
  # after a tap only the grid and the k/5 counter must calm down (sand never stops moving)
  settle_min_s: 0.25
  settle_max_s: 1.5
  settle_threshold: 0.01     # frame change (0..1) of settle_zones below this = settled
  settle_zones: [grid_zone, counter]
  # tempo: from one confirmed decision release up to burst_max buckets back to back (each
  # follow-up re-checked on the simulated state after the previous taps, tappable in both
  # confirming frames, never the last free slot, its colour at least burst_min_avail avail)
  burst_max: 3
  burst_min_free: 2
  burst_min_avail: 0.05
  burst_min_score: 0.3       # a follow-up must also score this much (run 145310: #25 yellow 0.15)
  burst_gap_s: 0.3           # + clicks.max_taps_per_second
  # "about to be covered": a colour's contact-layer share dropped by cover_min_drop within
  # cover_window_s while no bucket of it is on the belt -> bonus weight_covering x drop
  cover_window_s: 2.0
  cover_min_drop: 0.03
  weight_covering: 1.0
  retap_guard_s: 2.0         # never tap the same cell again this soon (flying bucket animation)
  max_no_effect_taps: 2      # taps in a row that changed nothing -> stop
  screen_confirm_frames: 3   # leaving gameplay: non-gameplay this many analyses in a row (then flow: takes over)
  win_sand_max: 0.01         # no level_complete template yet: level left with less sand = win
  window_lost_max_s: 30.0    # no window / failed geometry check this long -> stop (run 161536:
                             # Mirroring vanished at 76 s; the bot waits for it to come back)
  max_run_s: 900.0           # one level, from its first gameplay frame
  disagree_report_s: 10.0    # a cell's look and the path rule disagree this long while there is no move: log STUCK + save the frame
  # belt speed 2x (user, 2026-10-20: the ▶▶2x button under the k/5 counter is free and resets
  # every level). Green = on, grey = off (hud.read_speed); while it reads off at level start
  # the bot taps it (only it), then the planner re-plans with the 2x belt (planner.speed_x2_*)
  speed_x2: true
  speed_zone: [0.43, 0.54, 0.57, 0.57]
  speed_hue: [35, 85]        # OpenCV hue of the green "on" button
  speed_min_sv: 100          # ... min saturation / value of its pixels
  speed_on_share: 0.25       # green share of speed_zone -> on (live gameplay frames 0.34-0.57)
  speed_off_grey: 0.3        # grey share and no green -> off (live ~0.4)
  speed_confirm_frames: 2    # same reading this many gameplay frames in a row
  speed_max_taps: 2          # taps per level while it still reads off, then play at 1x
  speed_retap_s: 3.0
  loop_interval_s: 0.05
  max_saved_frames: 1500     # PNGs per run in debug/runs/<stamp>/frames/

planner:                     # levelplan.py + sim.py: whole-level plan (docs/GAME_RULES.md "Level plan")
  enabled: true              # false = greedy strategy only (strategy.py)
  beam: 8                    # beam search: nodes kept per depth
  max_depth: 120             # actions (taps + waits) per plan
  budget_s: 3.0              # search time per plan (the bot waits meanwhile)
  cell_px: 8                 # sand cell of the simulated picture = this many frame px
  # belt speed of the simulator, measured on real runs: python -m tools.belt_speed
  # (fill %/s of a belt bucket = fill_rate x (its colour's contact-layer share - fill_min_exposed),
  # at most fill_max; runs 142035 / 145310 / 161536: ~1 %/s below 15 %, ~25 %/s at 30 %)
  lap_s: 1.0                 # belt seconds per simulated lap
  fill_rate: 100.0
  fill_min_exposed: 0.08
  fill_max: 30.0
  tap_s: 4.2                 # belt seconds per tap of the bot (decision + settle; lower quartile live)
  # belt speed 2x (bot.speed_x2): planner times are real seconds, so 2x scales the fill speeds;
  # tap_s is the bot's own cycle and stays. null = 1x value x speed_x2_factor (rate / max) or
  # the 1x value (min exposed) - set them from python -m tools.belt_speed once 2x runs exist
  speed_x2_factor: 2.0
  # measured (python -m tools.belt_speed on runs 000105 / 001541 / 092045 / 101655, 645 2x
  # samples): 90 x (share - 0.03), max 60 %/s - the doubled 1x guess (200 x (share - 0.08))
  # gave buckets at 3-8 % of the contact layer nothing; live they filled slowly
  speed_x2_fill_rate: 90.0
  speed_x2_fill_max: 60.0
  speed_x2_fill_min_exposed: 0.03
  max_wait_s: 60.0           # one simulated wait at most
  # live: a plan step waiting for the belt is given up (re-plan; if the new plan waits too, the
  # strategy decides until the board changes) when the belt is wait_grace_s behind the plan's
  # predicted time or no belt bucket gained sand for wait_stall_s (run 161536: 32 s stall)
  wait_grace_s: 5.0
  wait_stall_s: 5.0
  replan_min_s: 2.0          # the board differs from the plan: re-plan at most this often
  # beam score = share of the sand collected (+10 for a win) - weight_dead x belt buckets that
  # can never fill - weight_stuck x belt buckets whose colour is not exposed + weight_free x free
  weight_dead: 0.1
  weight_stuck: 0.05
  weight_free: 0.02
  weight_full: 0.05          # per planned tap that takes the last free slot: only for >= 5 % more sand
  # user's player hints (L189 run 20261021-101655): the plan used to stop where the collected
  # sand peaked (11 of the 15 taps that break L189's ice 15) and never planned past it
  weight_tap: 0.03           # hint 2/3: per bucket released (deeper plans rank higher)
  weight_open: 0.05          # hint 3: per cell opened (ice, key lock, chain gate, revealed mystery)
  weight_idle: 0.002         # hint 1: per belt slot-second of a bucket that collects nothing (release
                             # a bucket shortly before its colour is exposed, not long before)
  start_beam: 24             # hint 2: the plan at level start searches wider / longer
  start_budget_s: 6.0
  burst_max: 3               # hint 4: back-to-back plan steps tapped in one burst (bot.burst_gap_s apart)
  burst_tap_s: 1.0           # ... and their belt seconds per tap in the simulator

flow:                        # flow.py: screens outside gameplay (docs/GAME_RULES.md "Bot behaviour outside gameplay")
  # win -> NEXT, menu -> PLAY (popups -> red ✕ first), revive -> Quit (else the popup's ✕),
  # fail -> Try Again, ads -> wait for a ✕. Never Keep Playing / Watch Ad / Get App / purchases.
  confirm_frames: 3          # same screen + same button this many analyses in a row -> tap
  target_tolerance: 0.02     # "same button": its centre moved less than this (relative)
  tap_cooldown_s: 2.5        # after a screen tap, no other screen tap this long
  same_button_max: 3         # the same button tapped this often while the screen stays -> stop
  max_taps_between_levels: 10  # screen taps without getting back into a level -> stop
  forbidden_margin: 0.01     # a tap must be at least this far outside forbidden anchors (Watch Ad, Get App, ...)
  unknown_max_s: 180.0       # screen "other" (unknown / loading) this long -> stop, frame saved
  ad_max_s: 180.0            # an ad with no ✕ found this long -> stop, frame saved
  ad_after_tap_s: 120.0      # an unknown screen this soon after a screen tap (Try Again / NEXT / Quit)
                             # may be an ad (run 171133: Trade Republic / Netflix, no ad anchor): ✕ / skip searched
  unknown_frame_s: 10.0      # on an unknown / ad screen: save a frame this often (frames/*-screen-*-wait)
  stuck_max_s: 90.0          # a known screen with nothing allowed to tap this long -> stop
  ad_context_s: 60.0         # an unknown screen this soon after an ad (end card) is searched for a ✕ too
  # ad chains (user, run 224631): ✕ / skip taps are unlimited and do not count towards
  # same_button_max / max_taps_between_levels; repeated every ad_retap_s until a known screen
  ad_retap_s: 3.0
  ad_chain_max_s: 600.0      # no known screen this long since the chain's first ad tap -> stop
  require_lives: true        # PLAY / Try Again only when the heart reads >= 1 life
  lives_zone: [0.60, 0.075, 0.70, 0.112]   # HUD heart with the lives digit
  heart_tol: 14.0            # LAB distance to palette ui heart_red
  heart_min_share: 0.15      # heart pixels in lives_zone (HUD ~0.3, other screens 0)
  # generic ad ✕ (adclose.py): an X-shaped glyph on a plain backdrop inside these zones
  close_zones: [[0.0, 0.0, 0.3, 0.2], [0.7, 0.0, 1.0, 0.2], [0.7, 0.8, 1.0, 1.0], [0.0, 0.8, 0.3, 1.0]]
  close_min_size: 0.022      # glyph size, share of screen width (the mute icon's x is 0.017)
  close_max_size: 0.09
  close_min_iou: 0.5         # overlap with a drawn X (real ✕ 0.75-0.86)
  # ad skip (adclose.find_skip): ▶| on a filled disc (run 171133 Trade Republic ad: yellow, top
  # right; its top-left twin is the mute speaker - never tapped) or a small ✕ on such a disc (run
  # 224631 Kingshot end card, too small for close_min_size). Never Download / install buttons.
  skip_zone: [0.75, 0.0, 1.0, 0.15]
  skip_min_size: 0.035
  skip_max_size: 0.09
  close_contrast: 40.0       # adaptive threshold offset (grey levels)

session:                     # python -m bot --levels N (unattended play)
  max_levels: 50             # --levels is capped at this
  max_total_minutes: 120.0   # whole session
  max_consecutive_fails: 3   # this many lost levels in a row -> stop

paths:
  dataset: dataset
  debug: debug
  palette: dataset/palette.json
